server {
    listen 80;
    server_name _;
    
    root /var/www/public;
    index index.php index.html;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # 1. Merekam IP Asli Pengunjung dari Nginx aaPanel / Docker Bridge
    set_real_ip_from  172.18.0.0/16;
    set_real_ip_from  127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # 2. Kompresi Gzip untuk mempercepat load assets React / CSS / JS
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 3. Handling Static Assets (Frontend / Vite build assets)
    location ~* \.(?:css|js|map|jpe?g|gif|png|webp|svgz?|woff2?|eot|ttf|otf|mp4|ico)$ {
        expires off;
        access_log off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # 4. Routing Utama Laravel & Inertia
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 5. Oper Request PHP ke Container App (PHP-FPM)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Mengarah ke service container 'app' pada port 9000
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        # Parameter Standar FastCGI
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # TERUSKAN STATUS HTTPS KEPADA LARAVEL
        # Ini mencegah bug Redirect Loop (/login -> /login)
        fastcgi_param HTTPS $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # 6. Blokir akses ke hidden files (.env, .git, dsb)
    location ~ /\. {
        deny all;
    }
}