# 1. Map HTTPS ditaruh di tingkat luar (di luar blok server)
map $http_x_forwarded_proto $fastcgi_https {
    default off;
    https on;
}

server {
    listen 80;
    server_name _;
    
    root /var/www/public;
    index index.php index.html;

    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # 2. Merekam IP Asli Pengunjung dari Nginx aaPanel / Docker Network
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  127.0.0.1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # 3. Kompresi Gzip untuk mempercepat load assets React / CSS / JS
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 4. Handling Static Assets dari Vite Build (/build/...)
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 5. Handling Static Assets umum lainnya (Gambar, Fonts, Favicon)
    location ~* \.(?:css|js|jpe?g|gif|png|webp|svgz?|woff2?|eot|ttf|otf|ico)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        access_log off;
        try_files $uri =404;
    }

    # 6. Routing Utama Laravel & Inertia
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 7. Oper Request PHP ke Container App (PHP-FPM)
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # Mengarah ke service container 'app' pada port 9000
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        # Parameter Standar FastCGI
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Teruskan Status HTTPS ke PHP-FPM
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
    }

    # 8. Blokir akses ke hidden files (.env, .git, dsb)
    location ~ /\. {
        deny all;
    }
}